<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Briefly</title>
    <style>
      :root {
        --ink: #14161c;
        --paper: #f3f0e8;
        --accent: #e23d12;
        --night: #101218;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--night);
        color: var(--paper);
        font-family: Fraunces, Georgia, "Times New Roman", serif;
      }

      .stage {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: var(--paper);
        clip-path: circle(0% at 50% 50%);
      }

      .stage.open {
        animation: iris 1.35s cubic-bezier(0.45, 0, 0.2, 1) forwards;
      }

      .stage iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--paper);
      }

      .intro {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        background: var(--night);
      }

      .intro.reveal {
        background: transparent;
        pointer-events: none;
      }

      .scene {
        display: grid;
        justify-items: center;
        gap: 2.4rem;
        width: min(920px, calc(100% - 3rem));
        text-align: center;
      }

      .orb {
        width: min(210px, 42vw);
        opacity: 0;
        animation: orb-in 0.85s ease 0.35s forwards;
      }

      .intro.reveal .orb {
        animation: orb-swell 0.95s ease forwards;
      }

      .orb svg { display: block; width: 100%; height: auto; }

      .ring, .orbit, .core {
        transform-box: fill-box;
        transform-origin: center;
      }

      .ring {
        fill: none;
        stroke: rgb(243 240 232 / 0.88);
        stroke-width: 1.4;
        stroke-dasharray: 7 13;
        animation: spin 16s linear infinite;
      }

      .ring-b {
        stroke: rgb(226 61 18 / 0.95);
        stroke-width: 1.5;
        stroke-dasharray: 2 11;
        animation: spin 11s linear infinite reverse;
      }

      .core {
        fill: var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
      }

      .orbit { animation: spin 7.5s linear infinite; }
      .orbit-b { animation: spin 10s linear infinite reverse; }
      .dot { fill: var(--paper); }
      .dot-b { fill: var(--accent); }

      .lines {
        display: grid;
        gap: 0.85rem;
        min-height: 7.5rem;
        transition: opacity 0.35s ease;
      }

      .intro.reveal .lines { opacity: 0; }

      .line {
        margin: 0;
        font-size: clamp(1.55rem, 3.4vw, 2.7rem);
        font-weight: 560;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }

      .word {
        display: inline-block;
        opacity: 0;
        transform: translateY(0.4em);
        animation: word 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .word.accent { color: var(--accent); }

      @keyframes orb-in { to { opacity: 1; } }
      @keyframes orb-swell {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(1.9); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.45); opacity: 0.65; }
      }
      @keyframes word { to { opacity: 1; transform: none; } }
      @keyframes iris { to { clip-path: circle(150% at 50% 50%); } }

      @media (prefers-reduced-motion: reduce) {
        .orb, .ring, .ring-b, .core, .orbit, .orbit-b, .word { animation: none; opacity: 1; transform: none; }
        .stage { clip-path: none; }
        .intro { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <iframe id="site" title="Briefly" src="/?intro=1"></iframe>
    </div>
    <div class="intro" id="intro">
      <div class="scene">
        <div class="orb" aria-hidden="true">
          <svg viewBox="0 0 200 200">
            <circle class="ring" cx="100" cy="100" r="78" />
            <circle class="ring ring-b" cx="100" cy="100" r="56" />
            <g class="orbit">
              <circle class="dot" cx="100" cy="18" r="4.5" />
            </g>
            <g class="orbit orbit-b">
              <circle class="dot dot-b" cx="100" cy="156" r="3.5" />
            </g>
            <circle class="core" cx="100" cy="100" r="9" />
          </svg>
        </div>
        <div class="lines" id="lines" aria-live="polite"></div>
      </div>
    </div>
    <script>
      const lines = [
        { text: "Still behind your competition without a website?", accent: [] },
        { text: "It’s time to grow your market.", accent: [] },
        { text: "Congrats. You’re in the right place.", accent: ["Congrats."] },
      ]
      const WORD = 230
      const LINE_GAP = 320
      const FIRST = 1200
      const root = document.getElementById("lines")
      let cursor = FIRST

      lines.forEach((line) => {
        const p = document.createElement("p")
        p.className = "line"
        const words = line.text.split(" ")
        words.forEach((word, index) => {
          const span = document.createElement("span")
          span.className = "word" + (line.accent.includes(word) ? " accent" : "")
          span.textContent = word
          span.style.animationDelay = cursor + "ms"
          p.appendChild(span)
          if (index < words.length - 1) p.appendChild(document.createTextNode(" "))
          cursor += WORD
        })
        root.appendChild(p)
        cursor += LINE_GAP
      })

      const revealAt = cursor + 550
      const heroAt = revealAt + 800
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches

      function go() {
        const frame = document.getElementById("site")
        frame.contentWindow?.postMessage("intro-go", window.location.origin)
      }

      if (reduce) {
        document.getElementById("stage").classList.add("open")
        document.getElementById("site").addEventListener("load", go)
      } else {
        window.setTimeout(() => {
          document.getElementById("lines").style.opacity = "0"
        }, revealAt - 380)
        window.setTimeout(() => {
          document.getElementById("intro").classList.add("reveal")
          document.getElementById("stage").classList.add("open")
        }, revealAt)
        window.setTimeout(go, heroAt)
        window.setTimeout(() => document.getElementById("intro").remove(), heroAt + 1800)
      }
    </script>
  </body>
</html>
